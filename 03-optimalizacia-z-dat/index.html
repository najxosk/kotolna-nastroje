<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Optimalizácia z hodinových dát — draft</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 1.5rem auto; padding: 0 1rem; }
    table { border-collapse: collapse; width: 100%; font-size: .85rem; }
    th, td { border: 1px solid #ddd; padding: .35rem .5rem; text-align: right; }
    th { background: #f0f3f6; }
    .warn { background: #fff3cd; padding: .75rem 1rem; border-radius: 8px; }
    .note { color: #555; font-size: .9rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .75rem; margin: 1rem 0; }
    .card { background: #f4f6f8; padding: .75rem 1rem; border-radius: 8px; }
    .card b { display: block; font-size: 1.25rem; }
  </style>
</head>
<body>
  <h1>Optimalizácia z dát (draft)</h1>
  <p class="warn">Import CSV — žiadne ručné hodinové ťukanie. Sample stĺpce <code>steam_th</code> / <code>feedwater_th</code> sú <strong>prietoky t/h</strong>, nie teploty. Pásma a flagy sú príklad, nie firemná norma.</p>
  <input type="file" id="file" accept=".csv,text/csv" />
  <div class="cards" id="cards"></div>
  <div id="table"></div>
  <script>
    const file = document.getElementById("file");
    file.addEventListener("change", async (e) => {
      const text = await e.target.files[0].text();
      const lines = text.trim().split(/\r?\n/);
      const headers = lines[0].split(",");
      const rows = lines.slice(1).map(l => {
        const c = l.split(",");
        const o = {}; headers.forEach((h, i) => o[h.trim()] = (c[i] || "").trim()); return o;
      });
      const num = (r, k) => parseFloat(r[k]);
      const steamKey = headers.includes("steam_th") ? "steam_th" : (headers.includes("steam_t") ? "steam_t" : null);
      const feedKey = headers.includes("feedwater_th") ? "feedwater_th" : (headers.includes("feedwater_t") ? "feedwater_t" : null);
      const loads = rows.map(r => num(r, "load_mw")).filter(x => !isNaN(x));
      const medLoad = [...loads].sort((a,b)=>a-b)[Math.floor(loads.length/2)] || 0;
      const minLoadForStats = Math.max(medLoad * 0.4, 0.5);

      const ratios = rows.map(r => {
        const load = num(r, "load_mw");
        const gas = num(r, "gas_nm3");
        const air = num(r, "air_flow");
        const steam = steamKey ? num(r, steamKey) : NaN;
        const feed = feedKey ? num(r, feedKey) : NaN;
        const running = r.running !== undefined ? Number(r.running) === 1 : load >= minLoadForStats;
        return {
          t: r.timestamp,
          load, gas, running,
          gas_per_mw: load > 0.05 ? gas / load : NaN,
          air_per_gas: gas > 0 ? air / gas : NaN,
          steam_per_feed: feed > 0 ? steam / feed : NaN,
          o2: num(r, "flue_o2_pct"),
          in_stats: running && load >= minLoadForStats
        };
      });

      const stats = ratios.filter(r => r.in_stats && !isNaN(r.gas_per_mw));
      const avg = (arr, k) => {
        const v = arr.map(r => r[k]).filter(x => !isNaN(x));
        return v.length ? v.reduce((s,x)=>s+x,0)/v.length : NaN;
      };
      const med = (arr, k) => {
        const v = arr.map(r => r[k]).filter(x => !isNaN(x)).sort((a,b)=>a-b);
        return v.length ? v[Math.floor(v.length/2)] : NaN;
      };
      const medGas = med(stats, "gas_per_mw");

      const cards = document.getElementById("cards");
      const fmt = (x, d=2) => isNaN(x) ? "—" : x.toFixed(d);
      cards.innerHTML = [
        ["Ø plyn/MW (beh)", fmt(avg(stats,"gas_per_mw"),1)],
        ["Ø vzduch/plyn (beh)", fmt(avg(stats,"air_per_gas"),2)],
        ["Ø para/nap.voda t/h", fmt(avg(stats,"steam_per_feed"),3)],
        ["Ø O₂ % (beh)", fmt(avg(stats,"o2"),2)],
        ["Hodin v štatistike", String(stats.length)]
      ].map(([l,v]) => `<div class="card">${l}<b>${v}</b></div>`).join("");

      let html = "<p class='note'>Štatistiky a flag len pre hodiny v behu (running=1 alebo load ≥ ~40 % mediánu). Odstávky/nábehy sa do priemeru nepočítajú. Flag &gt;8 % nad medián merného plynu = <em>príklad</em>, nie norma.</p>";
      html += "<table><tr><th>čas</th><th>load</th><th>beh</th><th>plyn/MW</th><th>vzduch/plyn</th><th>para/voda</th><th>O₂</th><th>flag</th></tr>";
      ratios.slice(-24).forEach(r => {
        const flag = (r.in_stats && !isNaN(r.gas_per_mw) && !isNaN(medGas) && r.gas_per_mw > medGas * 1.08) ? "vysoká merná*" : "";
        html += `<tr><td>${r.t}</td><td>${fmt(r.load)}</td><td>${r.in_stats?"áno":"nie"}</td><td>${fmt(r.gas_per_mw,1)}</td><td>${fmt(r.air_per_gas)}</td><td>${fmt(r.steam_per_feed,3)}</td><td>${fmt(r.o2)}</td><td>${flag}</td></tr>`;
      });
      html += "</table>";
      document.getElementById("table").innerHTML = html;
    });
  </script>
</body>
</html>
