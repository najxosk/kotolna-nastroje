<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alarm tree — demo (placeholder)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 1.5rem auto; padding: 0 1rem; line-height: 1.45; }
    .warn { background: #f8d7da; border: 1px solid #f1aeb5; padding: .75rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
    button { margin: .25rem .25rem 0 0; padding: .5rem .9rem; font-size: 1rem; cursor: pointer; }
    .muted { color: #555; font-size: .9rem; }
    #out { margin-top: 1rem; padding: 1rem; background: #f4f6f8; border-radius: 8px; min-height: 4rem; }
  </style>
</head>
<body>
  <h1>Alarm decision tree — demo</h1>
  <p class="warn"><strong>NIE JE POSTUP PRE VAŠU KOTOLŇU.</strong> Placeholder na UX. Neobsahuje lockouty/permissives ani oprávnenia na reštart. Bez textov z vášho panelu nerobiť ostré.</p>
  <p class="muted">Vyber symptóm, potom ÁNO/NIE.</p>
  <div id="menu"></div>
  <div id="out"></div>
  <script>
    const trees = {
      flame: {
        title: "Plameň zhasol (príklad)",
        nodes: {
          start: { q: "Je prívod plynu otvorený a tlak v norme?", yes: "air", no: "gas" },
          air: { q: "Je vzduch / ventilátor v poriadku (beh, klapky)?", yes: "ign", no: "fan" },
          ign: { q: "Dovoľuje predpis / permissives riadený reštart a máš na to oprávnenie?", yes: "proc", no: "call" },
          gas: { end: "Pravdepodobne prívod/tlak plynu. Bezpečný stav podľa predpisu, skontroluj armatúry, volaj ak mimo. Zapíš: čas, tlak plynu, stav armatúr. (Placeholder — overiť u vás.)" },
          fan: { end: "Skontroluj ventilátor / vzduchovú cestu podľa predpisu. Zapíš: stav ventilátora, klapky. (Placeholder.)" },
          proc: { end: "Len podľa platného postupu reštartu. Ak znova zhasne → volaj. Zapíš: počet pokusov. (Placeholder.)" },
          call: { end: "Bez oprávnenia / po kontrole stále zle → majster/pohotovosť. Zapíš: čo si skontroloval. (Placeholder.)" }
        }
      },
      pressure: {
        title: "Nízky tlak pary (príklad)",
        nodes: {
          start: { q: "Je odber pary náhle vyšší (veľký odber v sieti)?", yes: "load", no: "burn" },
          load: { end: "Možná špička odberu. Sleduj výkon, komunikuj s odberom. Zapíš: tlak, odber ak vieš. (Placeholder.)" },
          burn: { q: "Horák beží na očakávanom výkone?", yes: "leak", no: "fuel" },
          leak: { end: "Skontroluj odvzdušnenia / poistky / zjavné úniky podľa predpisu. Zapíš: miesta. (Placeholder.)" },
          fuel: { end: "Over palivo a reguláciu. Zapíš: výkon %, tlak pary, palivo. (Placeholder.)" }
        }
      },
      drum: {
        title: "Vysoká hladina v bubne (príklad)",
        nodes: {
          start: { q: "Je údaj hladiny konzistentný na všetkých ukazovateľoch (nie jeden zlý snímač)?", yes: "feed", no: "sensor" },
          feed: { q: "Je napájanie / regulačný ventil v rozumnej polohe (nepretáča do bubna)?", yes: "steam", no: "valve" },
          steam: { end: "Over odber pary a ďalšie podľa predpisu; pri limitoch konaj podľa havarijného postupu. Zapíš: hladiny, napájanie, odber. (Placeholder — nie ostrý postup.)" },
          sensor: { end: "Možný chybný snímač / odkalenie merania podľa predpisu. Zapíš: ktoré ukazovatele nesedia. (Placeholder.)" },
          valve: { end: "Rieš napájanie/ventil podľa predpisu; neimprovizuj mimo oprávnení. Zapíš: poloha ventila, prietok. (Placeholder.)" }
        }
      }
    };
    const menu = document.getElementById("menu");
    const out = document.getElementById("out");
    Object.entries(trees).forEach(([id, t]) => {
      const b = document.createElement("button");
      b.textContent = t.title;
      b.onclick = () => show(id, "start");
      menu.appendChild(b);
    });
    function show(treeId, nodeId) {
      const n = trees[treeId].nodes[nodeId];
      if (n.end) {
        out.innerHTML = "<strong>Záver (placeholder)</strong><p>" + n.end + "</p><button onclick=\"location.reload()\">Späť</button>";
        return;
      }
      out.innerHTML = "<p><strong>" + n.q + "</strong></p>";
      const y = document.createElement("button"); y.textContent = "ÁNO"; y.onclick = () => show(treeId, n.yes);
      const no = document.createElement("button"); no.textContent = "NIE"; no.onclick = () => show(treeId, n.no);
      out.appendChild(y); out.appendChild(no);
    }
  </script>
</body>
</html>
